[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "set-based-models"
version = "0.1.0"
description = "Existential rule discovery and shared set-based model utilities"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["set_based_models*", "set_based_dt*"]
