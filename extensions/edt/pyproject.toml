[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "set-based-models-edt"
version = "0.1.0"
description = "Optional existential decision-tree extension for set-based-models"
requires-python = ">=3.10"
dependencies = ["set-based-models>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["set_based_edt*"]
